# Continuous integration: every push to main and every pull request is linted, scanned for
# security issues, tested at every level, and built into the Docker image Railway will run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Code security scan (bandit)
        run: bandit -q -c pyproject.toml -r app scripts
      - name: Dependency vulnerabilities (pip-audit)
        # The three chromadb advisories concern Chroma's HTTP server (tenants, RBAC, remote
        # model code); this service embeds Chroma in-process and exposes no Chroma server.
        run: >
          pip-audit -r requirements-dev.txt --progress-spinner off
          --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

  tests:
    name: Tests (unit → system)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4  # Newman runs the Postman collection in the system tests
        with:
          node-version: "22"
      - name: OCR and fonts (as in the Docker image)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara fonts-noto-core
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -m unit --cov --cov-report= --cov-fail-under=0
      - name: Integration tests
        run: pytest -m integration --cov --cov-append --cov-report= --cov-fail-under=0
      - name: API tests
        run: pytest -m api --cov --cov-append --cov-report= --cov-fail-under=0
      - name: Security tests
        run: pytest -m security --cov --cov-append --cov-report= --cov-fail-under=0
      - name: System tests
        run: pytest -m system
      - name: Coverage (at least 90%)
        run: coverage report

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t isnad-database .
      - name: Start and check /health
        run: |
          docker run -d --name isnad -p 8000:8000 -e SITE_API_KEY=ci-site-key-0123456789abcdef isnad-database
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs isnad
          exit 1
